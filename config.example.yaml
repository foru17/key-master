public_base_url: https://example.com
listen:
  host: 0.0.0.0
  port: 3000
db_path: data/key-master.db
file_root: data/files
internal_cidrs: []
trusted_proxies: []
observe_mode: false
telegram:
  mode: polling
  owner_chat_ids: [] # Add quoted numeric owner chat IDs to enable approvals.
  max_polls: 10000 # Hard limit per process; restart to resume after reaching it.
  webhook_secret: ""
  # webhook_path: /_telegram/YOUR_RANDOM_SECRET_PATH_VALUE
bot:
  lang: en # en | zh
durations:
  grant_default: 600
  options: [600, 3600]
  block: 3600
  pending: 600
notice:
  timezone: UTC # IANA timezone for server-rendered notices; admin uses browser local time.
  contact_text: "Please contact the administrator / 请联系管理员"
  contact_url: ""
  footer: ""
  not_found_body: "404 Not Found\n"
# Existing machine tokens: SHA-256 only, never put a plaintext secret here.
# Hash UTF-8 KM_TOKEN_PEPPER + token when a pepper is configured (no separator).
tokens: []
# tokens:
#   - id: example-nginx-token
#     label: Example nginx integration
#     secret_sha256: "YOUR_64_CHARACTER_SHA256_HEX"
#     scope: [/private]
#     kind: machine
#     expires_at: "2027-01-01T00:00:00Z" # Optional ISO timestamp with zone, or Unix milliseconds.
# Trusted networks: active until revoked; IPv4 CIDRs /24 or narrower, IPv6 /48 or narrower.
allowlist: []
# allowlist:
#   - id: example-home
#     label: Example home broadband
#     value: home.example.com
#     scope: ["*"] # Optional; defaults to all resources.
# For a custom refresh interval, use the object form instead:
# allowlist:
#   resolve_interval_s: 300 # 60–86400 seconds; A + AAAA, last good snapshot kept on failure.
#   entries:
#     - id: example-network
#       label: Example fixed network
#       value: 203.0.113.0/24
#     - id: example-ipv6
#       label: Example IPv6 network
#       value: "2001:db8:1::/48"
resources:
  - slug: /welcome
    kind: inline
    source: "Welcome to key-master / 欢迎使用 key-master\n"
    content_type: "text/plain; charset=utf-8"
    policy: public
    enabled: true
  - slug: /private
    kind: inline
    source: "YOUR_PRIVATE_RESOURCE_CONTENT\n"
    content_type: "text/plain; charset=utf-8"
    policy: approval
    enabled: true
  # - slug: /file
  #   kind: file
  #   source: resource.txt
  #   policy: token_only
  # - slug: /upstream
  #   kind: upstream
  #   source: https://example.com/resource.txt
  #   policy: approval
ingest: {}
# ingest:
#   nginx_log: data/nginx-access.jsonl
admin:
  allowed_cidrs: [127.0.0.1/32, "::1/128"]
# Source details for humans (location / network of a requesting IP). Off by default: nothing is sent anywhere.
geo:
  provider: off # off | online | mmdb
  online_url: "" # e.g. https://geo.example.com/lookup ({ip} placeholder, otherwise ?ip= is appended)
  mmdb_dir: "" # directory with GeoLite2-City.mmdb and GeoLite2-ASN.mmdb
  cache_days: 7
  timeout_ms: 2500
